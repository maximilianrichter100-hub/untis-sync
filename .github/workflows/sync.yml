name: Untis Stundenplan Auto-Sync

on:
  schedule:
    # Läuft alle 6 Stunden (z. B. 00:00, 06:00, 12:00, 18:00 Uhr UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Ermöglicht es, den Ablauf jederzeit auch per Knopfdruck manuell zu starten

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pakete installieren
        run: |
          pip install requests icalendar

      - name: Stundenplan abrufen & ICS erstellen
        run: |
          python untis_sync.py

      - name: Aktualisierte ICS-Datei ins Repository hochladen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dpm_1_stundenplan.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Update Stundenplan" && git push)
